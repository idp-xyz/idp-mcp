# The Secrets the manifests reference, with placeholder values. NOT part of kustomization.yaml:
# create them with your secret management (External Secrets, Sealed Secrets, cert-manager, ...).
# tests/deploy checks that every secretKeyRef / secret volume in the manifests names a Secret and
# key listed here.
apiVersion: v1
kind: Secret
metadata:
  name: idp-mcp-registry-db
  namespace: idp-mcp
stringData:
  service-url: "postgres://idp_mcp_svc:CHANGE-ME@postgresql.databases.svc.cluster.local:5432/idp_mcp?sslmode=verify-full"
  owner-url: "postgres://idp_mcp_owner:CHANGE-ME@postgresql.databases.svc.cluster.local:5432/idp_mcp?sslmode=verify-full"
---
apiVersion: v1
kind: Secret
metadata:
  name: idp-mcp-registry-tls         # server certificate of the registry (cert-manager Certificate recommended)
  namespace: idp-mcp
type: kubernetes.io/tls
stringData:
  tls.crt: "-----BEGIN CERTIFICATE-----"
  tls.key: "-----BEGIN PRIVATE KEY-----"
---
apiVersion: v1
kind: Secret
metadata:
  name: idp-mcp-registry-ca          # CA that signed the registry certificate (trusted by gateways)
  namespace: idp-mcp
stringData:
  ca.crt: "-----BEGIN CERTIFICATE-----"
---
apiVersion: v1
kind: Secret
metadata:
  name: idp-mcp-gateway-ca           # CA that issues gateway client certificates (trusted by the registry)
  namespace: idp-mcp
stringData:
  ca.crt: "-----BEGIN CERTIFICATE-----"
---
apiVersion: v1
kind: Secret
metadata:
  name: idp-mcp-upstream-ca          # CA of internal MCP servers served over https (optional)
  namespace: idp-mcp
stringData:
  ca.crt: "-----BEGIN CERTIFICATE-----"
---
apiVersion: v1
kind: Secret
metadata:
  name: idp-mcp-gateway-edge-1       # from POST /api/v1/gateways: gatewayId and the once-shown token
  namespace: idp-mcp
stringData:
  gateway-id: "00000000-0000-4000-8000-000000000000"
  token: "idpgw_CHANGE-ME"
---
apiVersion: v1
kind: Secret
metadata:
  name: idp-mcp-gateway-edge-1-client-tls   # client certificate: URI SAN spiffe://idp-mcp/gateway/<gateway-id>
  namespace: idp-mcp
type: kubernetes.io/tls
stringData:
  tls.crt: "-----BEGIN CERTIFICATE-----"
  tls.key: "-----BEGIN PRIVATE KEY-----"
---
apiVersion: v1
kind: Secret
metadata:
  name: idp-mcp-gateway-edge-1-tls   # server certificate of the gateway's MCP endpoint
  namespace: idp-mcp
type: kubernetes.io/tls
stringData:
  tls.crt: "-----BEGIN CERTIFICATE-----"
  tls.key: "-----BEGIN PRIVATE KEY-----"
